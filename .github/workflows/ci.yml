name: CI

# Runs on every pull request and on pushes to main. Branch protection on main
# should require both jobs to pass before a PR can merge.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hakikisha_summative
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: hakikisha_summative/coverage/lcov.info

  security-rules:
    name: Firestore and Storage rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hakikisha_summative/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hakikisha_summative/backend/package-lock.json

      # The Firestore emulator needs Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm install -g firebase-tools
      - name: Run rules tests in the emulator
        run: npm test
